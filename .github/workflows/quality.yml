name: quality
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm run lint

      - name: Run unit tests
        # --runInBand ensures tests run sequentially, mirroring local execution
        run: pnpm run test -- --runInBand

      - name: Build project
        run: pnpm run build
